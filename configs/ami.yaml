dataset:
  name: ami
  rttm_dir: dataset/rttms/test
  audio_dir: dataset/test
  audio_template: "{rec}.wav"

segmentation:
  window_sec: 1.5
  hop_sec: 0.75
  min_interval_sec: 1.5
  merge_gap_sec: 0.0
  center_single_window: true

embedding:
  model: speechbrain/spkrec-ecapa-voxceleb
  savedir: checkpoints/ecapa
  sample_rate: 16000
  batch_size: 128
  device: cuda

clustering:
  laplacian: unnormalized
  k_max: 10
  p_min: 1
  p_max_ratio: 0.25
  p_stride: 1
  zero_diagonal: true
  use_siamese: true
  device: cuda
  dtype: float32
  seed: 0
  kmeans_n_init: 10
  siamese_weights: checkpoints/siamese/siamese.pt
  single_speaker:
    enabled: false
    mean_cosine_threshold: 0.50
  siamese:
    hiddens: [128, 128, 64]
    epochs: 30
    lr: 0.001
    n_neighbors: 2
    batch_size: 128

evaluation:
  rel_error_tol: 0.15
